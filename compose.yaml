services:
  app:
    build:
      context: .
    container_name: test-project_app
    ports:
      - "${APP_SERVER}:80"
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      PHP_IDE_CONFIG: serverName=test-project
      XDEBUG_MODE: debug,develop
      XDEBUG_CLIENT_HOST: host.docker.internal
      XDEBUG_START_WITH_REQUEST: trigger
    command: ["composer", "run", "dev"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - test-project

  db:
    image: mysql:8.4
    container_name: test-project_db
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - test-project_mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "--password=${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-project

  test-db:
    image: mysql:8.4
    container_name: test-project_test-db
    ports:
      - "${TEST_DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${TEST_DB_DATABASE}
      MYSQL_USER: ${TEST_DB_USERNAME}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_PASSWORD}
    volumes:
      - ./docker/mysql/conf.d/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${TEST_DB_USERNAME}", "--password=${TEST_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env.test
    networks:
      - test-project

networks:
  test-project:
    name: test-project
    driver: bridge

volumes:
  test-project_mysql_data:
